<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Гостевая книга</title>
</head>
<body>
    <h1>Гостевая книга</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Оставить отзыв</button>
    </form>

    <hr>

    <h2>Список отзывов</h2>
    <ul>
        {% for review in reviews %}
            <li>
                <strong>{{ review.author }}</strong>:
                <p>{{ review.text }}</p>
            </li>
        {% empty %}
            <li>Пока нет ни одного отзыва.</li>
        {% endfor %}
    </ul>
<p><a href="{% url 'admin:tasks_review_changelist' %}">Управление задачами в админке</a></p>
</body>
</html>
